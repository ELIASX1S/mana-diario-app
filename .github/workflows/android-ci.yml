name: Android CI

on:
  pull_request:
  push:
    branches: [ "main", "master", "work" ]

concurrency:
  group: android-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify-java21:
    name: Verify Java 21
    runs-on: ubuntu-latest
    steps:
      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Check active Java version
        run: |
          java -version
          JAVA_VERSION=$(java -version 2>&1 | head -n 1)
          echo "$JAVA_VERSION" | grep '"21\.'

  assemble:
    name: Assemble Debug
    runs-on: ubuntu-latest
    needs: verify-java21
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Assemble debug
        run: ./gradlew --no-daemon :app:assembleDebug --stacktrace

  unit-tests:
    name: Unit Tests
    runs-on: ubuntu-latest
    needs: verify-java21
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Run unit tests
        run: ./gradlew --no-daemon testDebugUnitTest --stacktrace

  lint:
    name: Android Lint
    runs-on: ubuntu-latest
    needs: verify-java21
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Run Android lint
        run: ./gradlew --no-daemon :app:lintDebug --stacktrace

  quality-gate:
    name: Quality Gate (required)
    runs-on: ubuntu-latest
    if: always()
    needs:
      - verify-java21
      - assemble
      - unit-tests
      - lint
    steps:
      - name: Enforce required checks
        run: |
          [ "${{ needs.verify-java21.result }}" = "success" ]
          [ "${{ needs.assemble.result }}" = "success" ]
          [ "${{ needs.unit-tests.result }}" = "success" ]
          [ "${{ needs.lint.result }}" = "success" ]
